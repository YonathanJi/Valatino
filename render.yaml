# Render Blueprint — despliegue de la API NestJS (apps/api).
# La web (apps/web) se despliega aparte en Vercel.
# Deploy: Render → New → Blueprint → selecciona este repo.
# Las variables marcadas sync:false se rellenan en el dashboard (son secretas).

services:
  - type: web
    name: valatino-api
    runtime: node
    plan: free
    branch: main
    # --prod=false garantiza que se instalen las devDependencies (nest cli, tsc).
    # No usar `corepack enable` (Render trae pnpm y el FS es de solo lectura).
    # Se compila @valatino/types (dependencia) antes que la API.
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm --filter @valatino/types build && pnpm --filter @valatino/api build
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Saltos de proxy en los que confiar para deducir la IP del cliente.
      # Render pone UN proxy delante, así que 1. Sin esto, req.ip es la IP del
      # proxy y el límite de peticiones agrupa a todos los clientes en un solo
      # cubo de 100/min. Ojo: NUNCA poner `true` en el código (ver main.ts) y
      # quedarse corto antes que pasarse, porque pasarse permite falsificar la
      # IP con X-Forwarded-For.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Secreto compartido con el proxy /api de la web (la MISMA cadena en
      # Vercel, con este nombre). Sirve para una cosa: que la API sepa que
      # quien llama es nuestro proxy y pueda creerse la IP del cliente que le
      # declara, en vez de contar la cuota por la IP del nodo de Vercel — que
      # es lo que mete a toda la tienda en el mismo cubo de 100/min.
      #
      # ⚠️ Esto NO se arregla subiendo TRUST_PROXY_HOPS a 2: a la API se llega
      # también en directo (confirmación del pedido y widget de calificar), y
      # con 2 saltos cualquiera se salta el límite mandando un X-Forwarded-For
      # inventado. Medido en su momento, no supuesto.
      #
      # Sin poner, no falla nada: se cuenta como antes. Se comprueba con
      # GET /diagnostico/red (solo admin).
      - key: PROXY_API_SECRETO
        sync: false
      # Origen(es) permitidos para CORS, separados por comas. Hoy la tienda vive
      # en su dominio propio, así que son https://valatino.es y su www; el
      # https://valatino-api-steel.vercel.app de la transición se conserva a
      # propósito y se quita cuando ya no lo use nadie. La misma lista decide
      # qué Origin acepta el middleware anti-CSRF (ver origenes-permitidos.ts),
      # así que quitar uno le corta también las escrituras.
      - key: CORS_ORIGIN
        sync: false
      # Preview URLs de Vercel: solo las de este proyecto, por prefijo
      # ("valatino" habilita https://valatino-<hash>.vercel.app). Sin esta
      # variable solo valen los origenes exactos de CORS_ORIGIN.
      - key: CORS_VERCEL_PREVIEW_PREFIX
        sync: false
      # --- Supabase ---
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Stripe ---
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # --- Email (SendGrid SMTP) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Buzón al que van las RESPUESTAS del cliente. Hace falta mientras
      # EMAIL_FROM sea del dominio propio y el dominio NO tenga registros MX:
      # sin esto, quien responde a la confirmación de su pedido recibe un
      # rebote. Se quita cuando valatino.es tenga buzón propio.
      - key: EMAIL_REPLY_TO
        sync: false
      # --- Transferencia bancaria ---
      # Sin IBAN y titular la opción NO se ofrece en el checkout: el método se
      # apaga solo en vez de enseñarse para luego no poder decir a dónde pagar.
      # Se rellenan en el dashboard porque son datos de la empresa, no del
      # repositorio (cambiar de cuenta no debe exigir un despliegue).
      - key: TRANSFERENCIA_IBAN
        sync: false
      - key: TRANSFERENCIA_TITULAR
        sync: false
      - key: TRANSFERENCIA_BANCO
        sync: false
      # Días LABORABLES que se conceden para pagar. Es también el tiempo que el
      # pedido retiene su stock, así que subirlo inmoviliza inventario más rato.
      - key: TRANSFERENCIA_DIAS_PLAZO
        value: "3"
      # --- PayPal (opcional; sin estas la API arranca igual y PayPal da 503) ---
      # - key: PAYPAL_CLIENT_ID
      #   sync: false
      # - key: PAYPAL_CLIENT_SECRET
      #   sync: false
      # - key: PAYPAL_WEBHOOK_ID
      #   sync: false
      # - key: PAYPAL_ENVIRONMENT
      #   value: sandbox
